{% extends "base.html" %}
{% block title %}Reset Password — ArtisanHub{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
    <h2>Reset Password</h2>

    {% if error %}
        <p class="error-text">{{ error }}</p>
    {% endif %}

    <form method="post" action="{% url 'grabsomore:reset_password' %}">
        {% csrf_token %}
        <p><input type="password" name="password" placeholder="New password" required></p>
        <p><input type="password" name="password_conf" placeholder="Confirm new password" required></p>
        <button type="submit">Reset Password</button>
    </form>
</div>
{% endblock %}
