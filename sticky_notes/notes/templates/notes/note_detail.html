{% extends 'base.html' %}

{% block title %}Sticky Notes - {{ note.title }}{% endblock %}

{% block content %}
  <article class="note">
    <h2>{{ note.title }}</h2>
    <p>{{ note.content|linebreaks }}</p>
    <small>Created at: {{ note.created_at }}</small>
  </article>
  <a href="{% url 'note_update' pk=note.pk %}">Update note</a>
  <a href="{% url 'note_delete' pk=note.pk %}">Delete note</a>
  <a href="{% url 'note_list' %}">Back to all notes</a>
{% endblock %}
