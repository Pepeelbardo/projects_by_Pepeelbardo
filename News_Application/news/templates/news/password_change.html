{% extends 'news/base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1 style="color: #1c3d5a;">Change Password</h1>
<form method="post" style="max-width: 400px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background-color: #1c3d5a; color: #ffffff; border: none; padding: 0.5rem 1.5rem; border-radius: 4px;">Update Password</button>
</form>
{% endblock %}
