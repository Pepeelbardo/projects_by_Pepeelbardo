{% extends 'news/base.html' %}
{% block title %}My Account{% endblock %}
{% block content %}
<h1 style="color: #1c3d5a;">My Account</h1>

<p><strong>Username:</strong> {{ user.username }}</p>
<p><strong>Role:</strong> {{ user.get_role_display }}</p>

<form method="post" style="max-width: 400px; margin-top: 1rem;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background-color: #1c3d5a; color: #ffffff; border: none; padding: 0.5rem 1.5rem; border-radius: 4px;">Save Changes</button>
</form>

<p style="margin-top: 1.5rem;">
    <a href="{% url 'password-change' %}" style="color: #1c3d5a;">Change Password</a>
</p>
{% endblock %}
