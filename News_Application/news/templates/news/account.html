{% extends 'news/base.html' %}
{% block title %}My Account{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
  <div class="card">
    <div class="card-body">
      <h1 class="h4 mb-3" style="color: #1c3d5a;">My Account</h1>
      <p><strong>Username:</strong> {{ user.username }}</p>
      <p><strong>Role:</strong> {{ user.get_role_display }}</p>

      <form method="post" class="content-form mt-3">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>

      <p class="mt-3 mb-0">
          <a href="{% url 'password-change' %}" style="color: #1c3d5a;">Change Password</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
